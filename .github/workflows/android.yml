name: Android app

# Builds the unsigned Flash Android app (Play Store .aab and a test .apk) from android/.
# Signing happens outside GitHub with the upload key, which never goes in the repo.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: flash-android-unsigned
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      # The same unsigned files on the android-builds branch, where they can be fetched with git
      # to be signed (they hold no secrets: anyone can build them from android/).
      - name: Publish to the android-builds branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/bundle/release/*.aab app/build/outputs/apk/release/*.apk /tmp/out/
          # Vercel reads its settings from the commit it builds: this stops a failed preview on every build.
          echo '{"git":{"deploymentEnabled":false}}' > /tmp/out/vercel.json
          cd /tmp/out && git init -q -b android-builds && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Unsigned Android build of ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-builds
