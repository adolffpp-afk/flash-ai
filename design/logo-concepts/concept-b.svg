<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Concept B: "Gold Orbit". An emerald coin inside a gold ring; the bolt breaks out of the ring,
       and a red spark rides the orbit like a charge. Reads as a badge or app coin. -->
  <defs>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#14a873"/>
      <stop offset="0.6" stop-color="#065f46"/>
      <stop offset="1" stop-color="#032419"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="b" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#f08c00"/>
    </linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#060d0a"/>
  <g transform="translate(256 200)">
    <circle r="132" fill="url(#coin)"/>
    <circle r="132" fill="none" stroke="url(#ring)" stroke-width="14"/>
    <path d="M18 -150 -78 22h56l-26 128L110 -40H50z" fill="url(#b)" stroke="#060d0a" stroke-width="10" stroke-linejoin="round" paint-order="stroke"/>
    <circle cx="-96" cy="-92" r="15" fill="#ff4545"/>
    <circle cx="-96" cy="-92" r="26" fill="none" stroke="#ff4545" stroke-opacity="0.35" stroke-width="5"/>
  </g>
  <text x="256" y="455" text-anchor="middle" font-family="Geist, Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#e9efeb">Flash <tspan fill="url(#w)">AI</tspan></text>
</svg>
